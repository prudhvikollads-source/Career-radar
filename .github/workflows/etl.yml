name: Career Radar daily refresh

on:
  schedule:
    # Daily at ~06:30 UTC (02:30 America/Chicago)
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run ETL
        run: python3 etl/fetch_jobs.py

      - name: Commit refreshed data
        run: |
          git config user.name "career-radar-bot"
          git config user.email "career-radar-bot@users.noreply.github.com"
          git add web/data/jobs.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily job refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
