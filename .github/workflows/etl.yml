name: Career Radar hourly refresh

on:
  schedule:
    # Hourly at minute 0 (UTC)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run ETL
        run: python3 etl/fetch_jobs.py

      - name: Run Gulf ETL (NaukriGulf)
        run: python3 etl/fetch_gulf_jobs.py

      - name: Run India ETL (Naukri.com)
        run: python3 etl/fetch_india_jobs.py

      - name: Commit refreshed data
        run: |
          git config user.name "career-radar-bot"
          git config user.email "career-radar-bot@users.noreply.github.com"
          git add web/data/jobs.json web/gulf/jobs.json web/india/jobs.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Hourly job refresh: $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
